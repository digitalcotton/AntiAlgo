    // asking the direct parent over the relay protocol above. An

    // degraded state as a refused embed.

      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);

      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

order-bottom:1px solid var(--color-line);background:var(--color-surface);\">\n    <div style=\"max-width:1320px;margin-inline:auto;padding:10px clamp(16px,4vw,44px);display:flex;align-items:center;gap:12px;flex-wrap:wrap;\">\n      <a href=\"#docs\" style=\"font-size:0.85rem;color:var(--color-muted);\" style-hover=\"color:var(--color-foreground);\">← Back to the posting<\u002Fa>\n      <span aria-hidden=\"true\" style=\"color:var(--color-line-strong);\">/<\u002Fspan>\n      <span style=\"font-size:0.85rem;\">Product Designer, Codex at OpenAI<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:var(--color-line-strong);\">/<\u002Fspan>\n      <span style=\"font-size:0.85rem;color:var(--color-muted);\">Your documents<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <main id=\"docs\" style=\"max-width:1320px;margin-inline:auto;padding:0 clamp(16px,4vw,44px);\">\n\n    <section style=\"padding:clamp(22px,3vw,34px) 0 clamp(4px,1vw,10px);\">\n      <div data-headline=\"\" style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px;\">\n        <div style=\"display:flex;flex-direction:column;gap:12px;min-width:0;\">\n          <span style=\"display:inline-flex;align-items:center;gap:9px;flex-wrap:wrap;\">\n            <svg sc-camel-view-box=\"0 0 48 48\" aria-hidden=\"true\" style=\"width:11px;height:11px;flex:none;\"><circle cx=\"24\" cy=\"24\" r=\"19\" fill=\"none\" stroke=\"var(--color-verified)\" stroke-width=\"5\"><\u002Fcircle><rect x=\"16\" y=\"16\" width=\"16\" height=\"16\" fill=\"var(--color-verified)\"><\u002Frect><\u002Fsvg>\n            <span style=\"font-size:0.88rem;font-weight:600;color:var(--color-verified);\">Both documents drafted<\u002Fspan>\n            <span style=\"font-family:var(--font-mono);font-size:0.8rem;color:var(--color-muted);\">{{ draftStamp }}<\u002Fspan>\n          <\u002Fspan>\n          <h1 style=\"margin:0;font-weight:700;font-size:clamp(1.7rem,3.4vw,2.4rem);line-height:1.05;letter-spacing:-0.025em;text-wrap:pretty;\">Read them before you send them<\u002Fh1>\n          <p style=\"margin:0;font-size:0.95rem;line-height:1.55;color:var(--color-muted);max-width:66ch;text-wrap:pretty;\">Written for Product Designer, Codex at OpenAI, from your profile and the posting as published. Nothing is submitted for you. When they read right, download and apply.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <div style=\"width:100%;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:nowrap;border-bottom:1px solid var(--color-line);margin-top:clamp(20px,2.6vw,30px);\">\n      <div style=\"display:flex;gap:2px;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ showResume }}\" style=\"background:{{ resumeTabBg }};color:{{ resumeTabInk }};border:1px solid var(--color-line);border-bottom:none;font-weight:600;font-size:0.92rem;padding:11px 20px;min-height:44px;cursor:pointer;\">Resume<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ showCover }}\" style=\"background:{{ coverTabBg }};color:{{ coverTabInk }};border:1px solid var(--color-line);border-bottom:none;font-weight:600;font-size:0.92rem;padding:11px 20px;min-height:44px;cursor:pointer;\">Cover letter<\u002Fbutton>\n      <\u002Fdiv>\n      <span style=\"font-family:var(--font-mono);font-size:0.76rem;color:var(--color-muted);padding-bottom:10px;margin-left:auto;text-align:right;\">{{ pageMeta }}<\u002Fspan>\n    <\u002Fdiv>\n\n    <div data-cols=\"\" style=\"display:grid;grid-template-columns:minmax(0,1.62fr) minmax(300px,0.85fr);gap:clamp(22px,3vw,40px);padding-top:clamp(16px,2vw,22px);align-items:start;\">\n\n      <section style=\"display:flex;flex-direction:column;gap:14px;min-width:0;\">\n\n        <div style=\"position:relative;\">\n          <sc-if value=\"{{ busy }}\">\n            <div style=\"position:absolute;inset:0;z-index:5;background:var(--color-surface);opacity:0.86;display:flex;align-items:flex-start;justify-content:center;padding-top:80px;\">\n              <span style=\"font-family:var(--font-mono);font-size:0.82rem;letter-spacing:0.06em;color:var(--color-muted);\">Rewriting on your key, about 20 seconds<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ onResume }}\">\n            <article data-paper=\"\" style=\"background:var(--color-surface-2);border:1px solid var(--color-line-strong);box-shadow:0 2px 14px rgba(11,11,13,0.07);padding:clamp(28px,3.4vw,46px);display:flex;flex-direction:column;gap:20px;\">\n              <div data-resume-head=\"\" style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;border-bottom:1px solid var(--color-line);padding-bottom:14px;\">\n                <span style=\"font-weight:700;font-size:1.5rem;letter-spacing:-0.02em;\">Ryan Payne<\u002Fspan>\n                <span style=\"font-family:var(--font-mono);font-size:0.78rem;color:var(--color-muted);line-height:1.6;text-align:right;\">ryan@digitalcotton.com · Portland, OR<br>digitalcotton.com · linkedin.com/in/ryanpayne<\u002Fspan>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;flex-direction:column;gap:7px;\">\n                <span style=\"font-family:var(--font-mono);font-size:0.72rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-muted);\">Summary<\u002Fspan>\n                <p style=\"margin:0;font-size:0.94rem;line-height:1.6;background:var(--color-mark);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:2px 0;text-wrap:pretty;\">Product design leader who builds the interfaces people use to work with agents. Runs an internal agentic AI platform for 8,000 employees and an enterprise design system that reaches 4.6 million customers. Ships 0 to 1, writes the code when it helps, and holds a high bar for craft.<\u002Fp>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;flex-direction:column;gap:12px;\">\n                <span style=\"font-family:var(--font-mono);font-size:0.72rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-muted);\">Experience<\u002Fspan>\n\n                <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                  <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;\">\n                    <span style=\"font-weight:600;font-size:1rem;\">Manager, Product Design and Strategy<\u002Fspan>\n                    <span style=\"font-family:var(--font-mono);font-size:0.78rem;color:var(--color-muted);\">2021 to now<\u002Fspan>\n                  <\u002Fdiv>\n                  <span style=\"font-size:0.88rem;color:var(--color-muted);\">Fortune 250 utility · Internal AI platform and enterprise design system<\u002Fspan>\n                  <ul style=\"margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:7px;\">\n                    <li style=\"font-size:0.92rem;line-height:1.55;\"><span style=\"background:var(--color-mark);box-decoration-break:clone;-webkit-box-decoration-break:clone;\">Designed the agent workspace for an internal AI platform now used by 8,000 employees, from first prototype to production, including the review and approval surfaces people trust it through.<\u002Fspan><\u002Fli>\n                    <li style=\"font-size:0.92rem;line-height:1.55;\">Own an enterprise design system reaching 4.6 million customers: tokens through Style Dictionary, component API, adoption, and governance.<\u002Fli>\n                    <li style=\"font-size:0.92rem;line-height:1.55;\"><span style=\"background:var(--color-mark);box-decoration-break:clone;-webkit-box-decoration-break:clone;\">Wrote and shipped a conformance standard for AI-built interfaces, so agent output is checked by machine before a human signs it.<\u002Fspan><\u002Fli>\n                    <li style=\"font-size:0.92rem;line-height:1.55;\">Lead a team of six designers and partner daily with engineering, research, and product on long-term strategy and near-term shipping.<\u002Fli>\n                  <\u002Ful>\n                <\u002Fdiv>\n\n                <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                  <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;\">\n                    <span style=\"font-weight:600;font-size:1rem;\">Senior Product Designer<\u002Fspan>\n                    <span style=\"font-family:var(--font-mono);font-size:0.78rem;color:var(--color-muted);\">2017 to 2021<\u002Fspan>\n                  <\u002Fdiv>\n                  <span style=\"font-size:0.88rem;color:var(--color-muted);\">Digital Cotton · Product and platform work for software teams<\u002Fspan>\n                  <ul style=\"margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:7px;\">\n                    <li style=\"font-size:0.92rem;line-height:1.55;\">Took developer-facing tools from concept to launch with small teams, owning research, interaction, visual design, and front-end implementation.<\u002Fli>\n                    <li style=\"font-size:0.92rem;line-height:1.55;\">Built the prototype practice the team still uses to test ideas in code within a week.<\u002Fli>\n                  <\u002Ful>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--color-line);padding-top:14px;\">\n                <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                  <span style=\"font-family:var(--font-mono);font-size:0.72rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-muted);\">Selected work<\u002Fspan>\n                  <span style=\"font-size:0.9rem;line-height:1.55;\">Agent workspace, design system at scale, conformance standard for AI-built UI, tokenstoagents.ai<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                  <span style=\"font-family:var(--font-mono);font-size:0.72rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-muted);\">Tools and code<\u002Fspan>\n                  <span style=\"font-size:0.9rem;line-height:1.55;\">Figma, React and TypeScript, design tokens, prototyping in code, evaluation of model output<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Farticle>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ onCover }}\">\n            <article data-paper=\"\" style=\"background:var(--color-surface-2);border:1px solid var(--color-line-strong);box-shadow:0 2px 14px rgba(11,11,13,0.07);padding:clamp(28px,3.4vw,46px);display:flex;flex-direction:column;gap:18px;\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;border-bottom:1px solid var(--color-line);padding-bottom:14px;flex-wrap:wrap;\">\n                <span style=\"font-weight:700;font-size:1.3rem;letter-spacing:-0.02em;\">Ryan Payne<\u002Fspan>\n                <span style=\"font-family:var(--font-mono);font-size:0.78rem;color:var(--color-muted);\">Sep 18, 2026<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"margin:0;font-size:0.96rem;line-height:1.7;\">Hello Codex team,<\u002Fp>\n              <p style=\"margin:0;font-size:0.96rem;line-height:1.7;text-wrap:pretty;\">{{ coverOpening }}<\u002Fp>\n              <p style=\"margin:0;font-size:0.96rem;line-height:1.7;text-wrap:pretty;\">Most of my last four years has been spent on the same problem you are solving in public: making an agent legible enough that a person will delegate real work to it. I designed the workspace for an internal AI platform that now serves 8,000 employees, and the hardest parts were never the chrome. They were the review surfaces, the moments where the agent says what it is about to do and a person decides whether to let it. That is interaction design, and it is barely charted.<\u002Fp>\n              <p style=\"margin:0;font-size:0.96rem;line-height:1.7;text-wrap:pretty;\">I also run an enterprise design system that reaches 4.6 million customers, so I know what it costs to make a pattern hold once other teams depend on it. I write code when it shortens the argument, and I ship fast without dropping the craft bar. A hybrid week in San Francisco works for me.<\u002Fp>\n              <p style=\"margin:0;font-size:0.96rem;line-height:1.7;text-wrap:pretty;\">I would like to help shape how Codex looks and behaves as it grows. My portfolio is at digitalcotton.com, and the agent work is the first case study.<\u002Fp>\n              <p style=\"margin:0;font-size:0.96rem;line-height:1.7;\">Thank you for reading,<br>Ryan Payne<\u002Fp>\n            <\u002Farticle>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;\">\n          <span style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n            <button type=\"button\" sc-camel-on-click=\"{{ downloadPdf }}\" style=\"border:1px solid var(--color-line-strong);background:var(--color-surface-2);font-size:0.88rem;padding:10px 16px;min-height:44px;cursor:pointer;\" style-hover=\"border-color:var(--color-foreground);\">Download PDF<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ downloadPdf }}\" style=\"border:1px solid var(--color-line-strong);background:var(--color-surface-2);font-size:0.88rem;padding:10px 16px;min-height:44px;cursor:pointer;\" style-hover=\"border-color:var(--color-foreground);\">Download DOCX<\u002Fbutton>\n            <button type=\"button\" style=\"border:1px solid var(--color-line-strong);background:var(--color-surface-2);font-size:0.88rem;padding:10px 16px;min-height:44px;cursor:pointer;\" style-hover=\"border-color:var(--color-foreground);\">Copy as text<\u002Fbutton>\n            <button type=\"button\" style=\"border:1px solid var(--color-line-strong);background:var(--color-surface-2);font-size:0.88rem;padding:10px 16px;min-height:44px;cursor:pointer;\" style-hover=\"border-color:var(--color-foreground);\">Edit in place<\u002Fbutton>\n          <\u002Fspan>\n        <\u002Fdiv>\n\n        <p style=\"margin:0;font-size:0.84rem;line-height:1.5;color:var(--color-muted);max-width:70ch;text-wrap:pretty;\">Highlighted lines were written for this posting. Everything else came from your profile unchanged, so you can tell at a glance what the model touched.<\u002Fp>\n      <\u002Fsection>\n\n      <aside data-rail=\"\" style=\"position:sticky;top:18px;display:flex;flex-direction:column;gap:14px;\">\n\n        <div style=\"border:1px solid var(--color-line-strong);background:var(--color-surface-2);\">\n          <div style=\"padding:14px 18px;border-bottom:1px solid var(--color-line);\">\n            <span style=\"font-weight:600;font-size:0.95rem;\">Not right yet? Steer it<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:16px 18px;display:flex;flex-direction:column;gap:11px;\">\n            <span style=\"display:flex;flex-wrap:wrap;gap:7px;\">\n              <button type=\"button\" sc-camel-on-click=\"{{ steerShorter }}\" style=\"background:none;border:1px solid var(--color-line-strong);font-size:0.85rem;padding:7px 12px;min-height:36px;cursor:pointer;color:var(--color-muted);\" style-hover=\"color:var(--color-foreground);border-color:var(--color-foreground);\">Shorter<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ steerAgents }}\" style=\"background:none;border:1px solid var(--color-line-strong);font-size:0.85rem;padding:7px 12px;min-height:36px;cursor:pointer;color:var(--color-muted);\" style-hover=\"color:var(--color-foreground);border-color:var(--color-foreground);\">Lead with agent work<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ steerPlain }}\" style=\"background:none;border:1px solid var(--color-line-strong);font-size:0.85rem;padding:7px 12px;min-height:36px;cursor:pointer;color:var(--color-muted);\" style-hover=\"color:var(--color-foreground);border-color:var(--color-foreground);\">Plainer voice<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ steerCode }}\" style=\"background:none;border:1px solid var(--color-line-strong);font-size:0.85rem;padding:7px 12px;min-height:36px;cursor:pointer;color:var(--color-muted);\" style-hover=\"color:var(--color-foreground);border-color:var(--color-foreground);\">More technical<\u002Fbutton>\n            <\u002Fspan>\n            <textarea rows=\"3\" placeholder=\"Or say it in your own words. Example: cut the utility background to one line and open with Codex.\" value=\"{{ steer }}\" sc-camel-on-change=\"{{ onSteer }}\" style=\"width:100%;resize:vertical;background:var(--color-surface);border:1px solid var(--color-line-strong);padding:10px 12px;font-size:0.88rem;line-height:1.5;\"><\u002Ftextarea>\n            <button type=\"button\" sc-camel-on-click=\"{{ regenerate }}\" style=\"display:flex;align-items:center;justify-content:center;background:none;border:1px solid var(--color-foreground);font-weight:600;font-size:0.92rem;padding:12px 18px;min-height:46px;cursor:pointer;\" style-hover=\"background:var(--color-foreground);color:var(--color-foreground-inverse);\">{{ regenerateLabel }}<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ downloadBoth }}\" style=\"display:flex;align-items:center;justify-content:center;background:none;border:1px solid var(--color-line-strong);font-weight:600;font-size:0.92rem;padding:12px 18px;min-height:46px;cursor:pointer;\" style-hover=\"border-color:var(--color-foreground);\">Download both<\u002Fbutton>\n            <span style=\"font-family:var(--font-mono);font-size:0.74rem;color:var(--color-muted);line-height:1.5;\">{{ draftLine }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid var(--color-line);padding:12px 18px;display:flex;flex-direction:column;gap:8px;\">\n            <span style=\"font-size:0.85rem;color:var(--color-muted);\">Earlier drafts are kept<\u002Fspan>\n            <sc-for list=\"{{ drafts }}\" as=\"d\" hint-placeholder-count=\"2\">\n              <span style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;\">\n                <span style=\"font-family:var(--font-mono);font-size:0.8rem;\">{{ d.label }}<\u002Fspan>\n                <button type=\"button\" sc-camel-on-click=\"{{ d.action }}\" style=\"background:none;border:none;cursor:pointer;padding:4px 0;font-size:0.84rem;color:{{ d.ink }};border-bottom:1px solid var(--color-line-strong);\">{{ d.cta }}<\u002Fbutton>\n              <\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"apply\" style=\"border:1px solid var(--color-foreground);background:var(--color-surface-2);\">\n          <div style=\"padding:14px 18px;border-bottom:1px solid var(--color-line);\">\n            <span style=\"font-weight:600;font-size:0.95rem;\">Send it<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:16px 18px;display:flex;flex-direction:column;gap:12px;\">\n            <a href=\"#apply\" style=\"display:flex;align-items:center;justify-content:center;background:var(--color-foreground);color:var(--color-foreground-inverse);font-weight:600;font-size:1rem;padding:15px 20px;min-height:52px;text-align:center;\" style-hover=\"color:var(--color-foreground-inverse);opacity:0.86;\">Apply on Ashby ↗<\u002Fa>\n            <p style=\"margin:0;font-size:0.82rem;line-height:1.5;color:var(--color-muted);text-wrap:pretty;\">Opens OpenAI's own posting in a new tab and moves this role to Applied on your desk. You still paste and submit there.<\u002Fp>\n            <div style=\"display:flex;gap:14px;flex-wrap:wrap;border-top:1px solid var(--color-line);padding-top:12px;\">\n              <button type=\"button\" sc-camel-on-click=\"{{ toggleSaved }}\" style=\"background:none;border:none;cursor:pointer;padding:6px 0;font-size:0.88rem;color:var(--color-muted);border-bottom:1px solid var(--color-line-strong);\" style-hover=\"color:var(--color-foreground);border-color:var(--color-foreground);\">{{ savedLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid var(--color-line);background:var(--color-surface-2);padding:16px 18px;display:flex;flex-direction:column;gap:11px;\">\n          <span style=\"font-weight:600;font-size:0.95rem;\">What it changed for this posting<\u002Fspan>\n          <span style=\"display:flex;flex-direction:column;gap:9px;\">\n            <span style=\"display:flex;gap:10px;align-items:baseline;\">\n              <span style=\"font-family:var(--font-mono);font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-muted);width:68px;flex:none;\">Rewrote<\u002Fspan>\n              <span style=\"font-size:0.88rem;line-height:1.45;\">Summary and two bullets, pointed at agent tooling and 0 to 1 shipping.<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"display:flex;gap:10px;align-items:baseline;\">\n              <span style=\"font-family:var(--font-mono);font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-muted);width:68px;flex:none;\">Added<\u002Fspan>\n              <span style=\"font-size:0.88rem;line-height:1.45;\">A line on shipping code, because the posting asks for a technical background.<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"display:flex;gap:10px;align-items:baseline;\">\n              <span style=\"font-family:var(--font-mono);font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-muted);width:68px;flex:none;\">Kept<\u002Fspan>\n              <span style=\"font-size:0.88rem;line-height:1.45;\">Every date, title, and number exactly as your profile has them.<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"display:flex;gap:10px;align-items:baseline;\">\n              <span style=\"font-family:var(--font-mono);font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent);width:68px;flex:none;\">Check<\u002Fspan>\n              <span style=\"font-size:0.88rem;line-height:1.45;\">Hybrid, 3 days in San Francisco. The letter says that works for you.<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fspan>\n          <span style=\"font-family:var(--font-mono);font-size:0.74rem;line-height:1.5;color:var(--color-muted);border-top:1px solid var(--color-line);padding-top:10px;\">Drafted on your own key · your profile and the posting text only · no other applicant's data was read<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fmain>\n\n  <sc-if value=\"{{ sticky }}\">\n    <div style=\"position:fixed;bottom:0;left:0;right:0;z-index:80;background:var(--color-surface-2);border-top:1px solid var(--color-line-strong);box-shadow:0 -1px 14px rgba(11,11,13,0.09);\">\n      <div style=\"max-width:1320px;margin-inline:auto;padding:10px clamp(16px,4vw,44px);display:flex;align-items:center;justify-content:space-between;gap:16px;\">\n        <span style=\"display:flex;align-items:baseline;gap:10px;min-width:0;\">\n          <span style=\"font-weight:600;font-size:0.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">Product Designer, Codex<\u002Fspan>\n          <span style=\"font-family:var(--font-mono);font-size:0.76rem;color:var(--color-muted);white-space:nowrap;\">{{ checklistLine }}<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"display:flex;gap:10px;align-items:center;flex:none;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ downloadBoth }}\" style=\"background:none;border:1px solid var(--color-line-strong);font-size:0.88rem;padding:9px 16px;min-height:40px;cursor:pointer;white-space:nowrap;\" style-hover=\"border-color:var(--color-foreground);\">Download both<\u002Fbutton>\n          <a href=\"#apply\" style=\"background:var(--color-foreground);color:var(--color-foreground-inverse);font-weight:600;font-size:0.88rem;padding:10px 18px;min-height:40px;display:inline-flex;align-items:center;white-space:nowrap;\" style-hover=\"color:var(--color-foreground-inverse);opacity:0.86;\">Apply on Ashby ↗<\u002Fa>\n        <\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light' | 'dark'&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;defaultDoc&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;resume&quot;,&quot;cover&quot;],&quot;default&quot;:&quot;resume&quot;,&quot;tsType&quot;:&quot;'resume' | 'cover'&quot;,&quot;section&quot;:&quot;Display&quot;}}\">\nconst OPENINGS = [\n  \"I am applying for Product Designer on Codex. I have spent the last four years designing the surfaces people use to hand work to agents, and I would like to do that for the tool that is setting the pattern.\",\n  \"I want to design Codex. For four years I have built the interfaces people use to delegate work to agents inside a company of 8,000, and the questions you are answering in public are the ones I answer every week.\",\n  \"Product Designer, Codex is the job I have been rehearsing for. My last four years went into agent workspaces used by 8,000 people, and into the review surfaces that make delegating to a machine feel safe.\"\n];\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      theme: props.defaultTheme || 'light',\n      doc: props.defaultDoc || 'resume',\n      draft: 2,\n      variant: 0,\n      busy: false,\n      steer: '',\n      stamp: 'drafted 2 minutes ago',\n      resumeReady: false,\n      coverReady: false,\n      portfolioReady: true,\n      saved: false,\n      sticky: false\n    };\n  }\n\n  componentDidMount() {\n    this._onScroll = () => {\n      const y = window.scrollY || document.documentElement.scrollTop || 0;\n      const on = y > 260;\n      if (on !== this.state.sticky) this.setState({ sticky: on });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onScroll();\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this._onScroll);\n    clearTimeout(this._timer);\n  }\n\n  regen(steer) {\n    if (this.state.busy) return;\n    this.setState(s => ({ busy: true, steer: steer === undefined ? s.steer : steer }));\n    this._timer = setTimeout(() => {\n      this.setState(s => ({\n        busy: false,\n        draft: s.draft + 1,\n        variant: (s.variant + 1) % OPENINGS.length,\n        stamp: 'drafted just now',\n        resumeReady: false,\n        coverReady: false\n      }));\n    }, 1400);\n  }\n\n  renderVals() {\n    const s = this.state;\n    const dark = s.theme === 'dark';\n    const onResume = s.doc === 'resume';\n    const active = 'var(--color-foreground)';\n    const done = [s.resumeReady, s.coverReady, s.portfolioReady].filter(Boolean).length;\n\n    return {\n      theme: s.theme,\n      themeLabel: dark ? 'Light' : 'Dark',\n      toggleTheme: () => this.setState({ theme: dark ? 'light' : 'dark' }),\n\n      onResume: onResume,\n      onCover: !onResume,\n      showResume: () => this.setState({ doc: 'resume' }),\n      showCover: () => this.setState({ doc: 'cover' }),\n      resumeTabBg: onResume ? active : 'var(--color-surface)',\n      resumeTabInk: onResume ? 'var(--color-foreground-inverse)' : 'var(--color-muted)',\n      coverTabBg: onResume ? 'var(--color-surface)' : active,\n      coverTabInk: onResume ? 'var(--color-muted)' : 'var(--color-foreground-inverse)',\n      pageMeta: onResume ? 'resume, 1 page, ' + s.stamp : 'cover letter, 1 page, ' + s.stamp,\n\n      draftStamp: 'draft ' + s.draft + ', ' + s.stamp,\n      draftLine: 'Draft ' + s.draft + ' on your own key. About 20 seconds, roughly a cent.',\n      coverOpening: OPENINGS[s.variant],\n\n      busy: s.busy,\n      regenerateLabel: s.busy ? 'Rewriting...' : (onResume ? 'Regenerate the resume' : 'Regenerate the letter'),\n      regenerate: () => this.regen(),\n      steer: s.steer,\n      onSteer: e => this.setState({ steer: e.target.value }),\n      steerShorter: () => this.regen('Cut it by a third. Shorter sentences.'),\n      steerAgents: () => this.regen('Open with the agent platform work and keep it in front.'),\n      steerPlain: () => this.regen('Plainer voice. No sales language, no rule of three.'),\n      steerCode: () => this.regen('More technical. Name what I shipped in code.'),\n\n      drafts: [\n        { label: 'Draft ' + s.draft + ', current', cta: 'Viewing', ink: 'var(--color-faint)', action: () => {} },\n        { label: 'Draft ' + (s.draft - 1) + ', ' + (s.draft > 2 ? 'steered' : 'first pass'), cta: 'Restore', ink: 'var(--color-muted)', action: () => this.setState(st => ({ draft: Math.max(1, st.draft - 1), variant: (st.variant + 2) % OPENINGS.length, stamp: 'restored just now' })) }\n      ],\n\n      downloadPdf: () => this.setState(st => (onResume ? { resumeReady: true } : { coverReady: true })),\n      downloadBoth: () => this.setState({ resumeReady: true, coverReady: true }),\n      downloadState: (onResume ? s.resumeReady : s.coverReady) ? 'downloaded' : 'not downloaded yet',\n\n      resumeReady: s.resumeReady,\n      coverReady: s.coverReady,\n      portfolioReady: s.portfolioReady,\n      toggleResumeReady: () => this.setState(st => ({ resumeReady: !st.resumeReady })),\n      toggleCoverReady: () => this.setState(st => ({ coverReady: !st.coverReady })),\n      togglePortfolioReady: () => this.setState(st => ({ portfolioReady: !st.portfolioReady })),\n      checklistLine: done + ' of 3 ready',\n\n      savedLabel: s.saved ? 'Saved, finish later' : 'Save and finish later',\n      toggleSaved: () => this.setState(st => ({ saved: !st.saved })),\n      sticky: s.sticky\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
